name = "xone-wallet-api"
main = "src/index.ts"
compatibility_date = "2025-08-10"
# Allow this Worker to fetch other Workers on the same account (e.g. x402 seller on workers.dev).
# Without this, pay_x402 → seller returns Cloudflare 404 / error code 1042.
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
account_id = "02dd7efa4ca7a4f45fe830c2636bfbff"

[vars]
ALLOW_DEMO_AUTH = "true"
# Override after Pages URL is known, e.g. https://xone-wallet-web.pages.dev
API_CORS_ORIGIN = "*"
